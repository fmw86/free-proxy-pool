name: update

on:
  schedule:
    # Every 3 hours at :37 (UTC): 01:37, 04:37, ... (Beijing 09:37, 12:37, ...)
    - cron: '37 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  # serialise the *publish* step across jobs; the heavy check runs stay parallel
  PUBLISH_LOCK: update-publish

jobs:
  proxies:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: socks5
            sources: sources_socks5.txt
            prefix: socks5
          - job: http
            sources: sources_http.txt
            prefix: http
          - job: socks4
            sources: sources_socks4.txt
            prefix: socks4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect and check ${{ matrix.job }} proxies
        run: |
          python check_socks5.py \
            --collect --check \
            --protocol ${{ matrix.job }} \
            --sources ${{ matrix.sources }} \
            --workers 500 \
            --timeout 6 \
            --fast-ms 3000 \
            --source-result ${{ matrix.prefix }}_sources_result.csv \
            --output-prefix ${{ matrix.prefix }} \
            --input ${{ matrix.prefix }}_all.txt

      - name: Tag residential candidates
        run: |
          python tag_residential.py \
            --input ${{ matrix.prefix }}_detail.json \
            --output-prefix ${{ matrix.prefix }}

      - name: Publish results via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREFIX: ${{ matrix.prefix }}
          JOB: ${{ matrix.job }}
        run: |
          if [ ! -s "$PREFIX"_alive.txt ]; then
            echo "::warning::no alive $JOB proxies; keeping previous results"
            exit 0
          fi
          python .github/publish_results.py

      - name: Write summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREFIX: ${{ matrix.prefix }}
          JOB: ${{ matrix.job }}
        run: |
          {
            echo "${JOB}_updated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "${JOB}_candidates=$(wc -l < "$PREFIX"_all.txt)"
            echo "${JOB}_alive=$(wc -l < "$PREFIX"_alive.txt)"
            echo "${JOB}_fast=$( [ -f "$PREFIX"_fast.txt ] && wc -l < "$PREFIX"_fast.txt || echo 0 )"
            echo "${JOB}_residential=$( [ -f "$PREFIX"_residential.txt ] && wc -l < "$PREFIX"_residential.txt || echo 0 )"
          } > summary_fragment.txt
          python .github/publish_summary.py

  nodes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect and TCP-test nodes
        run: |
          python collect_nodes.py \
            --collect --check \
            --subs node_subs.txt \
            --workers 400 \
            --timeout 5 \
            --input nodes_all.txt \
            --output-prefix nodes

      - name: Publish results via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREFIX: nodes
          JOB: nodes
        run: |
          if [ ! -s nodes_alive.txt ]; then
            echo "::warning::no alive nodes; keeping previous results"
            exit 0
          fi
          python .github/publish_results.py

      - name: Write summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREFIX: nodes
          JOB: nodes
        run: |
          {
            echo "${JOB}_updated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "nodes_candidates=$( [ -f nodes_all.txt ] && wc -l < nodes_all.txt || echo 0 )"
            echo "nodes_alive=$(wc -l < nodes_alive.txt)"
            echo "nodes_residential=$( [ -f nodes_residential.txt ] && wc -l < nodes_residential.txt || echo 0 )"
          } > summary_fragment.txt
          python .github/publish_summary.py

  residential-index:
    needs: proxies
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Merge and publish residential.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/merge_residential.py

      - name: Write summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "residential_total=$(grep -c . residential.txt)"
            echo "residential_updated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > summary_fragment.txt
          python .github/publish_summary.py
